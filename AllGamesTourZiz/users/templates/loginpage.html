{% extends "base.html" %}

{% block title %}Вход {% endblock %}

{% block content %}
    {% if user.is_authenticated %}
        <a href="/users/logout/">Ливаем</a> с акка {{ user.username }}?
    {% else %}
        <p>Входим, господа</p>
        <form method="POST">
           {% csrf_token %}
            <div>
               {{ loginForm.as_p }}
                <p>{{ error }}</p>
            </div>
            <input type="submit" value="Send" >
        </form>
    {% endif %}
{% endblock %}
