<!DOCTYPE html>
{% load static %}
<html>
<head>
    <meta charset="utf-8" />
    <title>{% block title %}Default title{% endblock title %}</title>
</head>
<body>
    <header>
        <a href="/users/">Игроки</a> | <a href="/games/">Игры</a> | <a href="/sessions/">Сессии</a> |
        {% if user.is_authenticated %} <a href="/users/{{ user.username }}">{{ user.username }}</a>
        | <a href="/users/login">Выйти с акка</a>
        {% else %} <a href="/users/login/">Войти</a>
        {% endif %}
    </header>

    <div>{% block content%}Тут что-то будет{% endblock content %}</div>

    <footer>Привет от зизи)</footer>
</body>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const rows = document.querySelectorAll(".clickable-row");

  rows.forEach(row => {
    row.addEventListener("click", () => {
      window.location.href = row.dataset.href;
    });
  });
});

{% block additional_scripts %}{% endblock additional_scripts %}
</script>

</body>

<script src="{% static  "scripts/html-duration-picker.min.js" %} "></script>

<style>
.clickable-row {
  cursor: pointer;
}
.clickable-row:hover {
  background-color: #f5f5f5;
}
</style>
</html>
