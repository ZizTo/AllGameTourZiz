# TourZiz CD — авто-деплой на Windows сервер
# Триггерится на push в main/master
#
# Для self-hosted раннера на Windows сервере:
#   1. Установи GitHub Actions Runner: Settings > Actions > Runners > New self-hosted runner > Windows
#   2. Поменяй runs-on ниже на свой лейбл, например:
#      runs-on: [self-hosted, windows, tourziz]
#   3. На сервере должен стоять Python 3.12 (python --version)
#   4. Порт 8000 должен быть открыт в фаерволе
#
# Важно для settings.py (поменяй ручками, бро):
#   ALLOWED_HOSTS = ["*"]   # чтоб waitress пускал запросы

name: TourZiz Deploy

on:
  push:
    branches: ["main", "master"]

jobs:
  deploy:
    name: Deploy to Windows Server
    runs-on: [self-hosted, windows]
    timeout-minutes: 15

    env:
      PROJECT_DIR: AllGamesTourZiz
      PORT: 8000
      PID_FILE: tourziz_server.pid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Python
        shell: cmd
        run: |
          python --version
          where python

      - name: Upgrade pip
        shell: cmd
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        shell: cmd
        run: python -m pip install -r "${{ env.PROJECT_DIR }}\requirements.txt"

      - name: Django system checks
        shell: cmd
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py check

      - name: Check pending migrations
        shell: cmd
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        shell: cmd
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py migrate --noinput

      - name: Stop old server
        shell: powershell
        run: |
          $pidFile = "${{ github.workspace }}\${{ env.PID_FILE }}"
          $port = ${{ env.PORT }}

          if (Test-Path $pidFile) {
            $oldPid = Get-Content $pidFile -Raw
            if ($oldPid) {
              $oldPid = $oldPid.Trim()
              try {
                $proc = Get-Process -Id $oldPid -ErrorAction Stop
                Stop-Process -Id $oldPid -Force
                Write-Host "Остановлен процесс PID=$oldPid, Name=$($proc.ProcessName)"
              } catch {
                Write-Host "PID=$oldPid уже мёртв"
              }
            }
            Remove-Item $pidFile -Force
          }

          $connections = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue
          if ($connections) {
            foreach ($c in $connections) {
              try {
                $p = Get-Process -Id $c.OwningProcess -ErrorAction Stop
                Stop-Process -Id $c.OwningProcess -Force
                Write-Host "Убит процесс на порту $port, PID=$($c.OwningProcess), Name=$($p.ProcessName)"
              } catch {
                Write-Host "Не смог убить PID=$($c.OwningProcess)"
              }
            }
          } else {
            Write-Host "Порт $port свободен"
          }

          Start-Sleep -Seconds 2

      - name: Start new server
        shell: powershell
        run: |
          $projectDir = "${{ github.workspace }}\${{ env.PROJECT_DIR }}"
          $pidFile = "${{ github.workspace }}\${{ env.PID_FILE }}"
          $port = ${{ env.PORT }}

          $proc = Start-Process python `
            -ArgumentList "-m", "waitress", "--port=$port", "--host=0.0.0.0", "AllGamesTourZiz.wsgi:application" `
            -WorkingDirectory $projectDir `
            -WindowStyle Hidden `
            -PassThru

          if (-not $proc) {
            Write-Host "Не удалось запустить процесс"
            exit 1
          }

          $proc.Id | Out-File -FilePath $pidFile -NoNewline
          Write-Host "Сервер запущен на порту $port, PID=$($proc.Id)"

      - name: Verify deployment
        shell: powershell
        run: |
          $port = ${{ env.PORT }}
          $maxTries = 10

          for ($i = 1; $i -le $maxTries; $i++) {
            Write-Host "Проверка $i/$maxTries..."
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:$port/" -TimeoutSec 5 -UseBasicParsing
              Write-Host "ДЕПЛОЙ УСПЕШЕН! HTTP $($r.StatusCode) — сервер отвечает"
              exit 0
            } catch {
              Write-Host "Ждём..."
              Start-Sleep -Seconds 3
            }
          }

          Write-Host "Сервер не ответил за $($maxTries * 3) секунд. Проверь логи waitress."
          exit 1

  notify-fail:
    name: Deploy Failed
    needs: deploy
    if: failure()
    runs-on: [self-hosted, windows]

    steps:
      - name: Alert
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "=     ДЕПЛОЙ УПАЛ, БРО((                  ="
          Write-Host "=     Глянь логи в Actions на GitHub       ="
          Write-Host "============================================"
