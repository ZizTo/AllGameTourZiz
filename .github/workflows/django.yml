# TourZiz CD — авто-деплой на Windows сервер
# Триггерится на push в main/master
#
# Для self-hosted раннера:
#   1. Установи GitHub Actions Runner: Settings > Actions > Runners > New > Windows
#   2. Поменяй runs-on ниже на свой лейбл
#   3. Python в PATH (python --version)
#   4. Порт 8000 открыт в фаерволе
#
# settings.py:
#   ALLOWED_HOSTS = ["*"]

name: TourZiz Deploy

on:
  push:
    branches: ["main", "master"]

jobs:
  deploy:
    name: Deploy to Windows Server
    runs-on: [self-hosted, windows]
    timeout-minutes: 15

    env:
      PROJECT_DIR: AllGamesTourZiz
      PORT: 8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Verify Python
        shell: powershell
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python -m pip install -r requirements.txt

      - name: Django checks
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py check

      - name: Pending migrations
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py migrate --noinput

      - name: Stop old server
        shell: powershell
        run: |
          $taskName = "TourZizServer"
          $port = ${{ env.PORT }}

          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if ($task) {
            if ($task.State -eq "Running") {
              Stop-ScheduledTask -TaskName $taskName
              Write-Host "Stopped scheduled task $taskName"
            }
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false
            Write-Host "Removed scheduled task $taskName"
          }

          Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              Stop-Process -Id $_.OwningProcess -Force -ErrorAction Stop
              Write-Host "Killed port $port PID=$($_.OwningProcess)"
            } catch { }
          }

          Start-Sleep -Seconds 2

      - name: Start new server
        shell: powershell
        run: |
          $projectDir = Join-Path "${{ github.workspace }}" "${{ env.PROJECT_DIR }}"
          $port = ${{ env.PORT }}
          $taskName = "TourZizServer"

          $action = New-ScheduledTaskAction `
            -Execute "python" `
            -WorkingDirectory $projectDir `
            -Argument "-m waitress --port=$port --host=0.0.0.0 AllGamesTourZiz.wsgi:application"

          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(2)

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -Force

          Start-ScheduledTask -TaskName $taskName

          Start-Sleep -Seconds 5

          $task = Get-ScheduledTask -TaskName $taskName
          Write-Host "Task state: $($task.State)"

          if ($task.State -ne "Running") {
            $info = Get-ScheduledTaskInfo -TaskName $taskName
            Write-Host "Last run: $($info.LastRunTime)"
            Write-Host "Last result: $($info.LastTaskResult)"
            Write-Host "Task did not start. Trying direct launch..."
            Start-Process python `
              -ArgumentList "-m waitress --port=$port --host=0.0.0.0 AllGamesTourZiz.wsgi:application" `
              -WorkingDirectory $projectDir `
              -WindowStyle Hidden
            Start-Sleep -Seconds 3
          }

      - name: Verify deployment
        shell: powershell
        run: |
          $port = ${{ env.PORT }}
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "Health check $i/10..."
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:$port/" -TimeoutSec 5 -UseBasicParsing
              Write-Host "DEPLOY OK - HTTP $($r.StatusCode)"
              exit 0
            } catch { Start-Sleep -Seconds 3 }
          }
          Write-Host "Server not responding after 30s."
          Write-Host "Check: Get-ScheduledTask -TaskName TourZizServer | Select State, LastTaskResult"
          exit 1
