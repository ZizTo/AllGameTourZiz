# TourZiz CD — авто-деплой на Windows сервер
# Триггерится на push в main/master
#
# Для self-hosted раннера на Windows сервере:
#   1. Установи GitHub Actions Runner: Settings > Actions > Runners > New self-hosted runner > Windows
#   2. Поменяй runs-on ниже на свой лейбл, например:
#      runs-on: [self-hosted, windows, tourziz]
#   3. Порт 8000 должен быть открыт в фаерволе
#
# Важно для settings.py (поменяй ручками, бро):
#   ALLOWED_HOSTS = ["*"]   # чтоб waitress пускал запросы

name: TourZiz Deploy

on:
  push:
    branches: ["main", "master"]

jobs:
  deploy:
    name: Deploy to Windows Server
    runs-on: [self-hosted, windows]
    timeout-minutes: 15

    env:
      PROJECT_DIR: AllGamesTourZiz
      PORT: 8000
      PID_FILE: tourziz_server.pid
      PYTHON_DIR: ${{ github.workspace }}\.python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        shell: powershell
        run: |
          $pythonDir = "${{ env.PYTHON_DIR }}"

          if (Test-Path "$pythonDir\python.exe") {
            $ver = & "$pythonDir\python.exe" --version 2>&1
            Write-Host "Python already installed: $ver"
          } else {
            Write-Host "Downloading Python 3.12..."
            $url = "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
            $zip = "$env:TEMP\python-3.12.10.zip"

            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

            Write-Host "Extracting..."
            New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
            Expand-Archive -Path $zip -DestinationPath $pythonDir -Force

            # Enable pip in embeddable Python
            $pthFile = "$pythonDir\python312._pth"
            $content = Get-Content $pthFile -Raw
            $content = $content -replace "#import site", "import site"
            $content = $content -replace "python312.zip", "#python312.zip"
            Set-Content $pthFile -Value $content

            Write-Host "Bootstrapping pip..."
            & "$pythonDir\python.exe" -m ensurepip --upgrade
            & "$pythonDir\python.exe" -m pip install --upgrade pip

            Write-Host "Python 3.12 installed successfully"
          }

          # Put our Python FIRST in PATH for subsequent steps
          "$pythonDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
          "$pythonDir\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Python & pip
        shell: cmd
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        shell: cmd
        run: python -m pip install -r "${{ env.PROJECT_DIR }}\requirements.txt"

      - name: Django system checks
        shell: cmd
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py check

      - name: Check pending migrations
        shell: cmd
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        shell: cmd
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py migrate --noinput

      - name: Stop old server
        shell: powershell
        run: |
          $pidFile = "${{ github.workspace }}\${{ env.PID_FILE }}"
          $port = ${{ env.PORT }}

          if (Test-Path $pidFile) {
            $oldPid = (Get-Content $pidFile -Raw).Trim()
            if ($oldPid) {
              try {
                $proc = Get-Process -Id $oldPid -ErrorAction Stop
                Stop-Process -Id $oldPid -Force
                Write-Host "Stopped PID=$oldPid ($($proc.ProcessName))"
              } catch {
                Write-Host "PID=$oldPid already dead"
              }
            }
            Remove-Item $pidFile -Force
          }

          $conns = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue
          if ($conns) {
            foreach ($c in $conns) {
              try {
                $p = Get-Process -Id $c.OwningProcess -ErrorAction Stop
                Stop-Process -Id $c.OwningProcess -Force
                Write-Host "Killed process on port $port, PID=$($c.OwningProcess)"
              } catch {
                Write-Host "Could not kill PID=$($c.OwningProcess)"
              }
            }
          }

          Start-Sleep -Seconds 2

      - name: Start new server
        shell: powershell
        run: |
          $projectDir = "${{ github.workspace }}\${{ env.PROJECT_DIR }}"
          $pidFile = "${{ github.workspace }}\${{ env.PID_FILE }}"
          $port = ${{ env.PORT }}

          $proc = Start-Process python `
            -ArgumentList "-m", "waitress", "--port=$port", "--host=0.0.0.0", "AllGamesTourZiz.wsgi:application" `
            -WorkingDirectory $projectDir `
            -WindowStyle Hidden `
            -PassThru

          if (-not $proc) {
            Write-Host "Failed to start server"
            exit 1
          }

          $proc.Id | Out-File -FilePath $pidFile -NoNewline
          Write-Host "Server started on port $port, PID=$($proc.Id)"

      - name: Verify deployment
        shell: powershell
        run: |
          $port = ${{ env.PORT }}
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "Health check $i/10..."
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:$port/" -TimeoutSec 5 -UseBasicParsing
              Write-Host "DEPLOY SUCCESS! HTTP $($r.StatusCode)"
              exit 0
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          Write-Host "Server did not respond. Check logs."
          exit 1

  notify-fail:
    name: Deploy Failed
    needs: deploy
    if: failure()
    runs-on: [self-hosted, windows]

    steps:
      - name: Alert
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "=     ДЕПЛОЙ УПАЛ, БРО((                  ="
          Write-Host "=     Глянь логи в Actions на GitHub       ="
          Write-Host "============================================"
