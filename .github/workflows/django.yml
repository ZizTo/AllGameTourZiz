# TourZiz CD — авто-деплой на Windows сервер
# Триггерится на push в main/master
#
# Для self-hosted раннера:
#   1. Установи GitHub Actions Runner: Settings > Actions > Runners > New > Windows
#   2. Поменяй runs-on ниже на свой лейбл, например:
#      runs-on: [self-hosted, windows, tourziz]
#   3. Python 3.14 должен быть в PATH (python --version)
#   4. Порт 8000 открыт в фаерволе
#
# settings.py (поменяй ручками):
#   ALLOWED_HOSTS = ["*"]

name: TourZiz Deploy

on:
  push:
    branches: ["main", "master"]

jobs:
  deploy:
    name: Deploy to Windows Server
    runs-on: [self-hosted, windows]
    timeout-minutes: 15

    env:
      PROJECT_DIR: AllGamesTourZiz
      PORT: 8000
      PID_FILE: tourziz_server.pid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Verify Python
        shell: cmd
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        shell: cmd
        run: python -m pip install -r "${{ env.PROJECT_DIR }}\requirements.txt"

      - name: Django system checks
        shell: cmd
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py check

      - name: Check pending migrations
        shell: cmd
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        shell: cmd
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py migrate --noinput

      - name: Stop old server
        shell: powershell
        run: |
          $pidFile = "${{ github.workspace }}\${{ env.PID_FILE }}"
          $port = ${{ env.PORT }}

          if (Test-Path $pidFile) {
            $oldPid = (Get-Content $pidFile -Raw).Trim()
            if ($oldPid) {
              try {
                Stop-Process -Id $oldPid -Force -ErrorAction Stop
                Write-Host "Stopped PID=$oldPid"
              } catch {
                Write-Host "PID=$oldPid already dead"
              }
            }
            Remove-Item $pidFile -Force
          }

          $conns = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue
          foreach ($c in $conns) {
            try {
              Stop-Process -Id $c.OwningProcess -Force -ErrorAction Stop
              Write-Host "Killed port $port, PID=$($c.OwningProcess)"
            } catch {
              Write-Host "Could not kill PID=$($c.OwningProcess)"
            }
          }

          Start-Sleep -Seconds 2

      - name: Start new server
        shell: powershell
        run: |
          $projectDir = "${{ github.workspace }}\${{ env.PROJECT_DIR }}"
          $pidFile = "${{ github.workspace }}\${{ env.PID_FILE }}"
          $port = ${{ env.PORT }}

          $proc = Start-Process python `
            -ArgumentList "-m", "waitress", "--port=$port", "--host=0.0.0.0", "AllGamesTourZiz.wsgi:application" `
            -WorkingDirectory $projectDir `
            -WindowStyle Hidden `
            -PassThru

          if (-not $proc) {
            Write-Host "Failed to start server"
            exit 1
          }

          $proc.Id | Out-File -FilePath $pidFile -NoNewline
          Write-Host "Server started on port $port, PID=$($proc.Id)"

      - name: Verify deployment
        shell: powershell
        run: |
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "Health check $i/10..."
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:${{ env.PORT }}/" -TimeoutSec 5 -UseBasicParsing
              Write-Host "DEPLOY SUCCESS! HTTP $($r.StatusCode)"
              exit 0
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          Write-Host "Server did not respond."
          exit 1
