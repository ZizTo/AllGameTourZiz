# TourZiz CD — авто-деплой на Windows сервер
# Триггерится на push в main/master
#
# Для self-hosted раннера:
#   1. Установи GitHub Actions Runner: Settings > Actions > Runners > New > Windows
#   2. Поменяй runs-on ниже на свой лейбл
#   3. Python в PATH (python --version)
#   4. Порт 8000 открыт в фаерволе
#
# settings.py:
#   ALLOWED_HOSTS = ["*"]

name: TourZiz Deploy

on:
  push:
    branches: ["main", "master"]

jobs:
  deploy:
    name: Deploy to Windows Server
    runs-on: [self-hosted, windows]
    timeout-minutes: 15

    env:
      PROJECT_DIR: AllGamesTourZiz
      PORT: 8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Verify Python
        shell: powershell
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python -m pip install -r requirements.txt

      - name: Django checks
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py check

      - name: Pending migrations
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py migrate --noinput

      - name: Stop old server
        shell: powershell
        run: |
          $port = ${{ env.PORT }}

          Unregister-ScheduledTask -TaskName "TourZizServer" -Confirm:$false -ErrorAction SilentlyContinue

          Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              Stop-Process -Id $_.OwningProcess -Force -ErrorAction Stop
              Write-Host "Killed port $port PID=$($_.OwningProcess)"
            } catch { }
          }

          Start-Sleep -Seconds 2

      - name: Start new server
        shell: powershell
        run: |
          $projectDir = Join-Path "${{ github.workspace }}" "${{ env.PROJECT_DIR }}"
          $port = ${{ env.PORT }}

          $pythonPath = (Get-Command python).Source
          Write-Host "Python: $pythonPath"

          $cmd = "$pythonPath -m waitress --port=$port --host=0.0.0.0 AllGamesTourZiz.wsgi:application"

          $result = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = $cmd
            CurrentDirectory = $projectDir
          }

          Write-Host "ReturnValue: $($result.ReturnValue)"
          Write-Host "ProcessId: $($result.ProcessId)"

          if ($result.ReturnValue -ne 0) {
            Write-Host "WMI failed (code $($result.ReturnValue))"
            exit 1
          }

          Start-Sleep -Seconds 4

          try {
            $proc = Get-Process -Id $result.ProcessId -ErrorAction Stop
            Write-Host "Server running, PID=$($proc.Id)"
          } catch {
            Write-Host "Process died immediately. Trying manual launch for debug..."
            $log = Join-Path $projectDir "crash.log"
            Start-Process python `
              -ArgumentList "-m waitress --port=$port --host=0.0.0.0 AllGamesTourZiz.wsgi:application" `
              -WorkingDirectory $projectDir `
              -RedirectStandardError $log `
              -WindowStyle Hidden
            Start-Sleep -Seconds 3
            if (Test-Path $log) { Write-Host "Crash log:"; Get-Content $log | Write-Host }
          }

      - name: Verify deployment
        shell: powershell
        run: |
          $port = ${{ env.PORT }}
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "Health check $i/10..."
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:$port/" -TimeoutSec 5 -UseBasicParsing
              Write-Host "DEPLOY OK - HTTP $($r.StatusCode)"
              exit 0
            } catch { Start-Sleep -Seconds 3 }
          }
          Write-Host "Server not responding after 30s."
          Write-Host "Check: Get-ScheduledTask -TaskName TourZizServer | Select State, LastTaskResult"
          exit 1
