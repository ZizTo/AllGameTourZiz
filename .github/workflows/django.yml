# TourZiz CD — авто-деплой на Windows сервер
# Триггерится на push в main/master
#
# Для self-hosted раннера:
#   1. Установи GitHub Actions Runner: Settings > Actions > Runners > New > Windows
#   2. Поменяй runs-on ниже на свой лейбл
#   3. Python в PATH (python --version)
#   4. Порт 8000 открыт в фаерволе
#
# settings.py:
#   ALLOWED_HOSTS = ["*"]

name: TourZiz Deploy

on:
  push:
    branches: ["main", "master"]

jobs:
  deploy:
    name: Deploy to Windows Server
    runs-on: [self-hosted, windows]
    timeout-minutes: 15

    env:
      PROJECT_DIR: AllGamesTourZiz
      PORT: 8000
      PID_FILE: tourziz_server.pid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Verify Python
        shell: powershell
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python -m pip install -r requirements.txt

      - name: Django checks
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py check

      - name: Pending migrations
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        shell: powershell
        working-directory: ./${{ env.PROJECT_DIR }}
        run: python manage.py migrate --noinput

      - name: Stop old server
        shell: powershell
        run: |
          $pidFile = Join-Path "${{ github.workspace }}" "${{ env.PID_FILE }}"
          $port = ${{ env.PORT }}

          if (Test-Path $pidFile) {
            $oldPid = (Get-Content $pidFile -Raw).Trim()
            if ($oldPid) {
              try {
                Stop-Process -Id $oldPid -Force -ErrorAction Stop
                Write-Host "Stopped PID=$oldPid"
              } catch {
                Write-Host "PID=$oldPid already dead"
              }
            }
            Remove-Item $pidFile -Force
          }

          Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              Stop-Process -Id $_.OwningProcess -Force -ErrorAction Stop
              Write-Host "Killed port $port PID=$($_.OwningProcess)"
            } catch {
              Write-Host "Could not kill PID=$($_.OwningProcess)"
            }
          }

          Start-Sleep -Seconds 2

      - name: Start new server
        shell: powershell
        run: |
          $projectDir = Join-Path "${{ github.workspace }}" "${{ env.PROJECT_DIR }}"
          $pidFile = Join-Path "${{ github.workspace }}" "${{ env.PID_FILE }}"
          $port = ${{ env.PORT }}
          $logDir = Join-Path "${{ github.workspace }}" "logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $stdout = Join-Path $logDir "server_stdout.log"
          $stderr = Join-Path $logDir "server_stderr.log"

          $proc = Start-Process python `
            -ArgumentList "-m", "waitress", "--port=$port", "--host=0.0.0.0", "AllGamesTourZiz.wsgi:application" `
            -WorkingDirectory $projectDir `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden `
            -PassThru

          if (-not $proc) { Write-Host "Failed to start"; exit 1 }

          $proc.Id | Out-File -FilePath $pidFile -NoNewline
          Write-Host "Server PID=$($proc.Id)"
          Write-Host "Logs: $logDir"

          Start-Sleep -Seconds 4

          if ($proc.HasExited) {
            Write-Host "SERVER CRASHED (exit $($proc.ExitCode))"
            Write-Host "--- STDERR ---"
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            Write-Host "--- STDOUT ---"
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            exit 1
          }

          Write-Host "Process alive after 4s."

      - name: Verify deployment
        shell: powershell
        run: |
          $port = ${{ env.PORT }}
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "Health check $i/10..."
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:$port/" -TimeoutSec 5 -UseBasicParsing
              Write-Host "DEPLOY OK - HTTP $($r.StatusCode)"
              exit 0
            } catch { Start-Sleep -Seconds 3 }
          }

          Write-Host "Server not responding. Dumping logs:"
          $logDir = Join-Path "${{ github.workspace }}" "logs"
          $errLog = Join-Path $logDir "server_stderr.log"
          $outLog = Join-Path $logDir "server_stdout.log"

          Write-Host "--- STDERR ---"
          if (Test-Path $errLog) { Get-Content $errLog | Write-Host }

          Write-Host "--- STDOUT (last 50) ---"
          if (Test-Path $outLog) { Get-Content $outLog -Tail 50 | Write-Host }

          exit 1
